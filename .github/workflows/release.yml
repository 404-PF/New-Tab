name: Package Extension

on:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'
      - 'v*.*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Validating tag $TAG -> version $VERSION"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,3}$'; then
            echo "::error::Tag $TAG does not match required pattern vX[.Y[.Z[.W]]] (1-4 dot-separated integers, no leading zeros, no prerelease)"
            exit 1
          fi
          IFS='.' read -ra PARTS <<< "$VERSION"
          for n in "${PARTS[@]}"; do
            if [ "${#n}" -gt 5 ] || { [ "${#n}" -eq 5 ] && [ "$n" -gt 65535 ]; }; then
              echo "::error::Version component $n exceeds 65535"
              exit 1
            fi
          done
          ALL_ZERO=1
          for n in "${PARTS[@]}"; do
            if [ "$n" != "0" ]; then ALL_ZERO=0; break; fi
          done
          if [ "$ALL_ZERO" = 1 ]; then
            echo "::error::Version $VERSION is not allowed (all zero)"
            exit 1
          fi
          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          PACKAGE_VERSION="$(jq -r .version package.json)"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.json version $MANIFEST_VERSION does not match tag $TAG"
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version $PACKAGE_VERSION does not match tag $TAG"
            exit 1
          fi
          LOCK_VERSION="$(jq -r .version package-lock.json)"
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::package-lock.json version $LOCK_VERSION does not match tag $TAG"
            exit 1
          fi
          LOCK_PACKAGES_VERSION="$(jq -r '.packages."".version' package-lock.json)"
          if [ "$LOCK_PACKAGES_VERSION" != "null" ] && [ "$LOCK_PACKAGES_VERSION" != "$VERSION" ]; then
            echo "::error::package-lock.json packages.\"\".version $LOCK_PACKAGES_VERSION does not match tag $TAG"
            exit 1
          fi
          git fetch origin main --depth=1 || true
          if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main 2>/dev/null || echo HEAD)" ]; then
              echo "::error::Tag $TAG does not point to a commit on main"
              exit 1
            fi
          fi
          echo "✓ Tag $TAG validated"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # The extension is entirely static (vanilla HTML/CSS/JS with no
      # transpilation step).  If a build step is ever added, replace the
      # git archive below with the build output directory so the workflow
      # packages the compiled result rather than the raw source.
      - name: Export clean build directory
        run: |
          BUILD_DIR="/tmp/extension-build"
          mkdir -p "$BUILD_DIR"
          git archive --format=tar HEAD | tar x -C "$BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Strip development-only files
        shell: bash
        run: |
          set -euo pipefail
          : "${BUILD_DIR:?BUILD_DIR is not set or empty — aborting}"
          cd "$BUILD_DIR"
          rm -rf .github .husky .agents tests ISSUES screenshots
          rm -f .gitignore .nvmrc vitest.config.js eslint.config.js
          rm -f package.json package-lock.json

      - name: Build ZIP package
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          zip -r "${{ github.workspace }}/new-tab.zip" . -x "*.git*"
          echo "  ✓ new-tab.zip ($(stat -c%s "${{ github.workspace }}/new-tab.zip") bytes)"

      - name: Verify built package
        run: |
          set -euo pipefail
          ZIP="${{ github.workspace }}/new-tab.zip"
          if [ ! -f "$ZIP" ]; then echo "::error::new-tab.zip was not built"; exit 1; fi
          if [ ! -s "$ZIP" ]; then echo "::error::new-tab.zip is empty"; exit 1; fi
          unzip -tq "$ZIP"  # quick integrity check

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-package
          path: new-tab.zip

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: new-tab.zip
