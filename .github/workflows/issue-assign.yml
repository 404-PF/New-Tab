name: issue-assign

# Automatic assignment of every newly opened issue to the maintainer account
# in AUTO_ASSIGN_LOGIN, so each issue is owned by somebody who acts on it.
# This replaces the former /assign and /unassign comment commands, which are
# gone: the workflow has no issue-comment trigger and nothing commenter
# facing any more, so contributors cannot claim or release issues through it.
# A maintainer releasing or re-targeting a claim therefore uses the assignees
# UI directly.
#
# Policy, identical for the automatic path and a manual dispatch:
#   - The issue must be open and unassigned. An issue that already carries an
#     assignee is left alone, so a human claim made in the seconds between
#     the open event and the queued run is preserved rather than silently
#     becoming a second co-assignee.
#   - Bot-created issues are skipped on the automatic path, for the same
#     reason as issue-milestone: bots do not triage, so an assignee would
#     never act on the issue and would only churn the queue. A manual
#     dispatch carries no issue author in its payload, so that skip cannot
#     fire there and a maintainer can still backfill an issue a bot filed.
#   - The target login must resolve to a User account. Bots and
#     organizations cannot hold issue assignments, so a misconfigured
#     AUTO_ASSIGN_LOGIN fails the run instead of passing silently.
#
# The apply step re-reads the issue after the POST and verifies the assignee
# list changed exactly as requested; GitHub can silently skip an assignee it
# cannot assign, and this must fail loudly instead of claiming success.
#
# Nothing is posted to the issue on either path. The run log is the record,
# matching issue-label, issue-milestone, and issue-triage: posting a message
# on every new issue would be noise nobody asked for. The failure report
# below only comments for workflow_dispatch runs, which the requester did
# explicitly ask for; a broken automatic assignment stays visible as a
# failed job in the Actions tab.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to auto-assign (manual backfill / re-run)'
        required: true
        type: number

# The fixed account every newly opened issue is assigned to. A repository
# variable keeps the login out of the concurrency group and the job if, where
# an expression on a missing variable could abort the whole run; the apply
# step reads it from the environment instead and treats an unset value as
# "auto-assign off". Override per repository from
# Settings > Secrets and variables > Actions > Variables.
env:
  AUTO_ASSIGN_LOGIN: ${{ vars.AUTO_ASSIGN_LOGIN || '404-Page-Found' }}

# Assignment is check-then-write against the assignee list, so two runs on
# the same issue can race on stale state. Serialize per issue instead of
# trusting each read: group per issue number, never cancel
# (cancel-in-progress: false), and queue: max keeps every queued run waiting
# instead of letting a newer event replace the only pending one, so no
# assignment is lost and each run decides on the state the previous one left
# behind (same pattern as issue-milestone).
concurrency:
  group: >-
    ${{ format('issue-assign-{0}', github.event.issue.number || github.event.inputs.issue_number) }}
  cancel-in-progress: false
  queue: max

jobs:
  assign:
    # Name pinned so the single-entry matrix below doesn't rename the job.
    name: assign
    # Single source for the job timeout: timeout-minutes cannot read env,
    # but it can read matrix, and the failure report reads the same value.
    strategy:
      matrix:
        job-timeout-minutes: [5]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    # issues: write is the narrowest Actions permission that can add or
    # remove assignees on an issue. contents: read matches the other issue
    # workflows; no checkout or agent runs here.
    permissions:
      contents: read
      issues: write
    # No job-level gate: issues.opened and workflow_dispatch both always
    # run. Every skip reason is logged by the apply step instead (bot
    # author, closed issue, already assigned, AUTO_ASSIGN_LOGIN unset), so
    # the run log always explains why nothing happened.

    steps:
      # Record when the job started so the failure report can tell a
      # job-level timeout apart from a run cancelled manually (both show
      # up as cancelled()).
      - name: Record job start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # The single apply step: policy checks, the assignee mutation, and
      # verification all happen against a freshly re-read issue so the run
      # decides on state as of execution, not the event payload.
      - name: Auto-assign the issue to the maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          # The issue author's account type, used to skip bot-created issues
          # on the automatic path. workflow_dispatch has no issue author in
          # its payload, so this is empty there and the skip never fires.
          ISSUE_USER_TYPE: ${{ github.event.issue.user.type }}
        run: |
          set -euo pipefail

          # GitHub logins are [A-Za-z0-9-] up to 39 chars. Rejecting
          # anything else keeps a malformed AUTO_ASSIGN_LOGIN from reaching
          # gh arguments or the JSON bodies below. Logins are
          # case-insensitive; normalize upfront.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          # The :- default keeps this set -u-safe if the env block above is
          # ever removed. Empty is treated as "off", not a failure, so a
          # misconfiguration cannot fail every new issue.
          TARGET="${AUTO_ASSIGN_LOGIN:-}"
          if [ -z "$TARGET" ]; then
            echo 'AUTO_ASSIGN_LOGIN is empty; automatic assignment is disabled for this repository.'
            exit 0
          fi
          if ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'; then
            echo "::error::'$TARGET' is not a valid GitHub login."
            exit 1
          fi
          TARGET_LOW="$(lower "$TARGET")"

          list_has() {
            case ",$(lower "$1")," in
              *",$2,"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # workflow_dispatch may pass any number, so reject a pull request
          # number here; issues.opened always carries a real issue.
          if [ "$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq 'has("pull_request")')" = 'true' ]; then
            echo "::error::Issue #$ISSUE_NUMBER is a pull request; refusing to assign."
            exit 1
          fi

          # Re-read instead of trusting the event payload: state and
          # assignees may have changed while the run queued. A deleted
          # issue (or a permission/capacity problem) fails the run loudly
          # via set -e and reaches the failure report.
          #
          # Assignment policy: unless the issue is open and unassigned,
          # log the reason and exit 0 (a policy result, not a failure).
          # The guard re-reads on every call, so it runs once after the
          # queue delay and again immediately before the POST: the user
          # lookup in between is another network round trip during which
          # the issue can be closed or claimed by somebody else, and a
          # stale read must never decide the write.
          guard() {
            local state assignees
            # Bot-created issues are skipped for the same reason as
            # issue-milestone: bots do not triage, so an assignee would
            # never act on the issue and would only churn the queue. Only
            # the automatic path carries the author type, so a manual
            # dispatch never skips here.
            if [ "$ISSUE_USER_TYPE" = 'Bot' ]; then
              echo 'Bot-created issue; skipping automatic assignment.'
              exit 0
            fi
            state="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq .state)"
            assignees="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '[.assignees[].login] | join(",")')"
            echo "Issue #$ISSUE_NUMBER: state=$state, assignees=${assignees:-none}"
            if [ "$state" != open ]; then
              echo "Issue #$ISSUE_NUMBER is closed; skipping automatic assignment."
              exit 0
            fi
            if list_has "$assignees" "$TARGET_LOW"; then
              echo "Already assigned to @$TARGET — nothing changed."
              exit 0
            fi
            # An existing assignee is never replaced. The assignees
            # endpoint is additive, so POSTing here would only add a
            # co-assignee and undo somebody's explicit choice.
            if [ -n "$assignees" ]; then
              echo "Issue #$ISSUE_NUMBER is already assigned to $assignees; preserving the existing claim."
              exit 0
            fi
          }

          guard

          # Confirm the target user exists and is a real account before
          # touching the assignees. Bots and organizations cannot hold
          # issue assignments, and a failed lookup denies (fail closed).
          USER_TYPE=''
          if USER_TYPE="$(gh api "users/$TARGET" --jq .type 2>/dev/null)"; then
            echo "Resolved user type for '$TARGET': $USER_TYPE"
          else
            echo "::error::User lookup failed for '$TARGET'."
            exit 1
          fi
          if [ "$USER_TYPE" != 'User' ]; then
            echo "::error::'$TARGET' is of type '$USER_TYPE'; only human accounts can be assigned to an issue."
            exit 1
          fi

          # Second guard call: the user lookup above is another network
          # round trip during which the issue can be claimed or closed,
          # and a stale read must never decide the write.
          guard

          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/assignees" -f "assignees[]=$TARGET" >/dev/null

          # The re-read below is the source of truth: the assignees
          # endpoint may silently skip targeted users it cannot assign, so
          # a "success" must never be announced without re-reading.
          ASSIGNEES_AFTER="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '[.assignees[].login] | join(",")')"
          if ! list_has "$ASSIGNEES_AFTER" "$TARGET_LOW"; then
            echo "::error::GitHub did not assign '$TARGET' to issue #$ISSUE_NUMBER (assignable users only); refusing to announce success."
            exit 1
          fi
          echo "Assigned issue #$ISSUE_NUMBER to @$TARGET automatically."

      # Comment on the issue only for a workflow_dispatch run, which the
      # requester explicitly asked for. issues.opened failures and manual
      # cancellations stay silent: a broken automatic assignment belongs in
      # the Actions tab, not as a comment on a brand-new issue, and a
      # cancelled run was never requested at all (matching issue-label,
      # issue-milestone, and issue-triage).
      - name: Report assignment failure on issue
        if: >-
          (failure() || cancelled()) && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          JOB_TIMEOUT_MINUTES: ${{ matrix.job-timeout-minutes }}
        run: |
          set -euo pipefail
          # A step timeout fails its step, so failure() covers it. A
          # cancelled job is either a job-level timeout (report it) or a
          # manual cancel (stay silent). Only a job that ran to within 2
          # minutes of its timeout counts as timed out; earlier
          # cancellations are treated as manual.
          if [ "$JOB_STATUS" = 'cancelled' ]; then
            elapsed=$(( $(date +%s) - ${JOB_STARTED_AT:-0} ))
            if [ -z "${JOB_STARTED_AT:-}" ] || [ "$elapsed" -lt $(( (JOB_TIMEOUT_MINUTES - 2) * 60 )) ]; then
              echo "Run cancelled after ${elapsed}s (cancelled manually); not reporting."
              exit 0
            fi
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --body "Issue assignment failed or timed out. See the workflow run: $RUN_URL"
