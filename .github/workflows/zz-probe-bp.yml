name: probe-bp

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe branch protection via REST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- REST /branches/main/protection ---"
          if gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" > "$RUNNER_TEMP/bp.json" 2>"$RUNNER_TEMP/bp.err"; then
            echo "REST OK"
            jq -r '(.required_status_checks.checks // [] | .[].context), (.required_status_checks.contexts // [] | .[])' "$RUNNER_TEMP/bp.json" | sort -u
          else
            echo "REST FAILED:"; cat "$RUNNER_TEMP/bp.err"
          fi
      - name: Probe branch protection via GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- GraphQL branchProtectionRules ---"
          if gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){
                branchProtectionRules(first:20){
                  nodes{
                    pattern
                    requiredApprovingReviewCount
                    requiresStatusChecks
                    requiredStatusCheckContexts
                  }
                }
              }
            }' -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" > "$RUNNER_TEMP/bpg.json" 2>"$RUNNER_TEMP/bpg.err"; then
            echo "GRAPHQL OK"
            jq . "$RUNNER_TEMP/bpg.json"
          else
            echo "GRAPHQL FAILED:"; cat "$RUNNER_TEMP/bpg.err"
          fi
