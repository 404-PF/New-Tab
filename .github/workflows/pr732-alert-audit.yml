name: Resolve PR732 alerts

on:
  push:
    branches:
      - claude/elastic-borg-609522

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/elastic-borg-609522
          fetch-depth: 1
      - name: Apply targeted alert fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          todo_path = Path('src/features/todo.js')
          todo = todo_path.read_text()

          anchor = """  function parseLocalDate(dateString) {\n    const [year, month, day] = dateString.split('-').map(Number);\n    return new Date(year, month - 1, day);\n  }\n\n"""
          helper = """  function getDisplayLocale() {\n    if (typeof window.getDisplayLocale === 'function') {\n      return window.getDisplayLocale();\n    }\n    const currentLang = window.i18n ? window.i18n.currentLanguage() : 'en';\n    return currentLang === 'zh' ? 'zh-CN' : 'en-US';\n  }\n\n"""
          if helper not in todo:
              assert anchor in todo
              todo = todo.replace(anchor, anchor + helper, 1)

          old = """    const locale = typeof window.getDisplayLocale === 'function'\n      ? window.getDisplayLocale()\n      : (window.i18n ? window.i18n.currentLanguage() : 'en') === 'zh' ? 'zh-CN' : 'en-US';\n"""
          todo = todo.replace(old, "    const locale = getDisplayLocale();\n", 2)

          old = """    const currentLang = window.i18n ? window.i18n.currentLanguage() : 'en';\n    const locale = currentLang === 'zh' ? 'zh-CN' : 'en-US';\n"""
          todo = todo.replace(old, "    const locale = getDisplayLocale();\n", 1)

          old = """      const dueDate = document.createElement('div');\n      dueDate.className = `todo-due-date clickable ${todo.dueDate ? (isOverdue(todo.dueDate, todo.dueTime) ? 'overdue' : '') : 'empty'}`;\n"""
          new = """      const dueDate = document.createElement('div');\n      let dueDateState = 'empty';\n      if (todo.dueDate) {\n        dueDateState = isOverdue(todo.dueDate, todo.dueTime) ? 'overdue' : '';\n      }\n      dueDate.className = `todo-due-date clickable ${dueDateState}`;\n"""
          assert old in todo
          todo = todo.replace(old, new, 1)

          old = """      const dueDateText = document.createElement('span');\n      dueDateText.className = 'due-date-text';\n      dueDateText.textContent = todo.dueDate ? formatDate(todo.dueDate, todo.dueTime) : (window.i18n ? window.i18n.t('todoSetDate') : 'Set date');\n"""
          new = """      const dueDateText = document.createElement('span');\n      dueDateText.className = 'due-date-text';\n      let dueDateLabel = window.i18n ? window.i18n.t('todoSetDate') : 'Set date';\n      if (todo.dueDate) {\n        dueDateLabel = formatDate(todo.dueDate, todo.dueTime);\n      }\n      dueDateText.textContent = dueDateLabel;\n"""
          assert old in todo
          todo = todo.replace(old, new, 1)

          old = """    if (newDueDate !== null && newDueDate !== undefined) {\n      todo.dueDate = newDueDate;\n      if (!newDueDate) todo.dueTime = null;\n    }\n    if (newDueTime !== undefined) {\n      if (newDueTime === null || newDueTime === '') {\n        todo.dueTime = null;\n      } else if (isValidDueTime(newDueTime) && todo.dueDate) {\n        todo.dueTime = newDueTime;\n      } else if (!isValidDueTime(newDueTime)) {\n        // invalid time string ignored\n      }\n    }\n"""
          helper = """  function applyDueDateAndTime(todo, newDueDate, newDueTime) {\n    if (newDueDate !== null && newDueDate !== undefined) {\n      todo.dueDate = newDueDate;\n      if (!newDueDate) todo.dueTime = null;\n    }\n    if (newDueTime === undefined) return;\n    if (newDueTime === null || newDueTime === '') {\n      todo.dueTime = null;\n    } else if (isValidDueTime(newDueTime) && todo.dueDate) {\n      todo.dueTime = newDueTime;\n    }\n  }\n\n"""
          assert old in todo
          todo = todo.replace(old, helper + "    applyDueDateAndTime(todo, newDueDate, newDueTime);\n", 1)

          old = """    // Sort: incomplete items first (by order), then completed items (by completion time)\n    filtered.sort((a, b) => {\n      // If both are incomplete, sort by order (original position)\n      if (!a.completed && !b.completed) {\n        const orderA = a.order !== undefined ? a.order : new Date(a.createdAt).getTime();\n        const orderB = b.order !== undefined ? b.order : new Date(b.createdAt).getTime();\n        return orderA - orderB;\n      }\n\n      // If both are completed, sort by completion time (chronological)\n      if (a.completed && b.completed) {\n        const timeA = a.completedAt ? new Date(a.completedAt).getTime() : 0;\n        const timeB = b.completedAt ? new Date(b.completedAt).getTime() : 0;\n        return timeA - timeB;\n      }\n      \n      // Incomplete items come first\n      if (!a.completed && b.completed) return -1;\n      if (a.completed && !b.completed) return 1;\n      \n      return 0;\n    });\n"""
          new = """    // Sort: incomplete items first (by due date-time, then order), then completed items (by completion time)\n    filtered.sort((a, b) => {\n      if (!a.completed && !b.completed) {\n        const dueA = a.dueDate ? getDueDateTime(a.dueDate, a.dueTime) : null;\n        const dueB = b.dueDate ? getDueDateTime(b.dueDate, b.dueTime) : null;\n        if (dueA && dueB) {\n          const dueDifference = dueA.getTime() - dueB.getTime();\n          if (dueDifference !== 0) return dueDifference;\n        } else if (dueA) {\n          return -1;\n        } else if (dueB) {\n          return 1;\n        }\n        const orderA = a.order !== undefined ? a.order : new Date(a.createdAt).getTime();\n        const orderB = b.order !== undefined ? b.order : new Date(b.createdAt).getTime();\n        return orderA - orderB;\n      }\n\n      if (a.completed && b.completed) {\n        const timeA = a.completedAt ? new Date(a.completedAt).getTime() : 0;\n        const timeB = b.completedAt ? new Date(b.completedAt).getTime() : 0;\n        return timeA - timeB;\n      }\n\n      return a.completed ? 1 : -1;\n    });\n"""
          assert old in todo
          todo = todo.replace(old, new, 1)

          old = "const existingTime = timeInput && timeInput.value ? timeInput.value : todo.dueTime;"
          todo = todo.replace(old, "const existingTime = timeInput?.value || todo.dueTime;", 1)
          old = "const existingTime = timeInput2 && timeInput2.value ? timeInput2.value : todo.dueTime;"
          todo = todo.replace(old, "const existingTime = timeInput2?.value || todo.dueTime;", 1)
          old = "const hasDate = !!(elements.todoDueDate && elements.todoDueDate.value);"
          assert old in todo
          todo = todo.replace(old, "const hasDate = !!elements.todoDueDate?.value;", 1)
          old = "if (!elements.todoDueDate || !elements.todoDueDate.value) {"
          assert old in todo
          todo = todo.replace(old, "if (!elements.todoDueDate?.value) {", 1)

          calendar_re = re.compile(r"  // Create calendar HTML for inline picker\nfunction createCalendarHtml\(currentDate, selectedDateString, selectedDueTime\) \{.*?\n\}\n\n// Bind global listeners once per picker", re.S)
          calendar_new = """  // Create calendar HTML for inline picker\nfunction createCalendarDayHtml(date, month, today, selectedDate) {\n  const isCurrentMonth = date.getMonth() === month;\n  const isToday = date.toDateString() === today.toDateString();\n  const isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();\n\n  let classes = 'calendar-day';\n  if (!isCurrentMonth) classes += ' other-month';\n  if (isToday) classes += ' today';\n  if (isSelected) classes += ' selected';\n\n  return `<div class=\"${classes}\" data-date=\"${formatDateISO(date)}\">${date.getDate()}</div>`;\n}\n\nfunction createCalendarDaysHtml(startDate, year, month, selectedDate) {\n  const today = new Date();\n  let daysHtml = '';\n  for (let i = 0; i < 42; i++) {\n    const date = new Date(startDate);\n    date.setDate(startDate.getDate() + i);\n    daysHtml += createCalendarDayHtml(date, month, today, selectedDate);\n  }\n  return daysHtml;\n}\n\nfunction createCalendarHtml(currentDate, selectedDateString, selectedDueTime) {\n  const year = currentDate.getFullYear();\n  const month = currentDate.getMonth();\n  const selectedDate = selectedDateString ? parseLocalDate(selectedDateString) : null;\n\n  const firstDay = new Date(year, month, 1);\n  const startDate = new Date(firstDay);\n  startDate.setDate(startDate.getDate() - firstDay.getDay());\n\n  const daysHtml = createCalendarDaysHtml(startDate, year, month, selectedDate);\n  const timeValue = isValidDueTime(selectedDueTime) ? selectedDueTime : '';\n  const timeDisabled = !selectedDateString ? 'disabled' : '';\n  const dueTimeLabel = window.i18n ? window.i18n.t('dueTime') : 'Time';\n\n  return `\n    <div class=\"inline-calendar-header\">\n      <button type=\"button\" class=\"inline-prev-month\" aria-label=\"${window.i18n ? window.i18n.t('todoInlinePrevMonth') : 'Previous month'}\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n          <polyline points=\"15,18 9,12 15,6\"></polyline>\n        </svg>\n      </button>\n      <div class=\"inline-calendar-title\">\n        <span class=\"inline-calendar-month\">${getInlineMonthLabel(month)}</span>\n        <span class=\"inline-calendar-year\">${year}</span>\n      </div>\n      <button type=\"button\" class=\"inline-next-month\" aria-label=\"${window.i18n ? window.i18n.t('todoInlineNextMonth') : 'Next month'}\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n          <polyline points=\"9,18 15,12 9,6\"></polyline>\n        </svg>\n      </button>\n    </div>\n    <div class=\"inline-calendar-weekdays\">\n      <span>${window.i18n ? window.i18n.t('sunday') : 'Su'}</span>\n      <span>${window.i18n ? window.i18n.t('monday') : 'Mo'}</span>\n      <span>${window.i18n ? window.i18n.t('tuesday') : 'Tu'}</span>\n      <span>${window.i18n ? window.i18n.t('wednesday') : 'We'}</span>\n      <span>${window.i18n ? window.i18n.t('thursday') : 'Th'}</span>\n      <span>${window.i18n ? window.i18n.t('friday') : 'Fr'}</span>\n      <span>${window.i18n ? window.i18n.t('saturday') : 'Sa'}</span>\n    </div>\n    <div class=\"inline-calendar-days\">\n      ${daysHtml}\n    </div>\n    <div class=\"inline-time-row\">\n      <label for=\"inline-due-time-${year}-${month}\" class=\"inline-time-label\">${dueTimeLabel}</label>\n      <input type=\"time\" id=\"inline-due-time-${year}-${month}\" class=\"inline-due-time\" value=\"${timeValue}\" ${timeDisabled} aria-label=\"${dueTimeLabel}\" />\n    </div>\n    <div class=\"inline-calendar-footer\">\n      <button type=\"button\" class=\"inline-clear-date\">${window.i18n ? window.i18n.t('clearDate') : 'Clear'}</button>\n      <button type=\"button\" class=\"inline-today-date\">${window.i18n ? window.i18n.t('todayDate') : 'Today'}</button>\n    </div>\n  `;\n}\n\n// Bind global listeners once per picker"""
          todo, replaced = calendar_re.subn(calendar_new, todo, count=1)
          assert replaced == 1

          import_anchor = """  const handleMerge = () => {\n"""
          import_helpers = """  function createImportedTodo(item, order) {\n    const todo = { ...item };\n    todo.completed = !!item.completed;\n    todo.completedAt = item.completed ? (item.completedAt || item.createdAt || new Date().toISOString()) : null;\n    todo.dueDate = item.dueDate || null;\n    todo.dueTime = isValidDueTime(item.dueTime) && todo.dueDate ? item.dueTime : null;\n    todo.createdAt = item.createdAt || new Date().toISOString();\n    todo.order = order;\n    return todo;\n  }\n\n  function mergeImportedTodos(importedItems, existingTodos) {\n    const existingIds = new Set(existingTodos.map(t => t.id));\n    let maxOrder = existingTodos.reduce((max, t) => Math.max(max, t.order), -1);\n    let addedCount = 0;\n\n    for (const item of importedItems) {\n      if (existingIds.has(item.id)) continue;\n      maxOrder += 1;\n      existingTodos.push(createImportedTodo(item, maxOrder));\n      existingIds.add(item.id);\n      addedCount += 1;\n    }\n    return addedCount;\n  }\n\n"""
          assert import_anchor in todo
          todo = todo.replace(import_anchor, import_helpers + import_anchor, 1)

          merge_re = re.compile(r"  const handleMerge = \(\) => \{.*?\n  \};\n", re.S)
          merge_new = """  const handleMerge = () => {\n    const existingTodos = cloneTodos(todos);\n    existingTodos.forEach((t, i) => {\n      if (t.order === undefined) t.order = i;\n    });\n    const addedCount = mergeImportedTodos(importedTodos, existingTodos);\n\n    closeAllInlineDatePickers();\n    if (!saveTodos(existingTodos)) {\n      showTodoSaveError();\n      hideDialog();\n      return;\n    }\n\n    todos = existingTodos;\n    applyFilters();\n    closeEditModal(false);\n    scheduleTodoReminderCheck();\n    if (addedCount > 0) {\n      const msg = window.i18n ? window.i18n.t('importSuccess', { count: addedCount }) : 'Imported ' + addedCount + ' todos successfully.';\n      showToast(msg, 'success');\n    } else {\n      showToast(window.i18n ? window.i18n.t('importNoNewTodos') : 'No new todos to import.', 'info');\n    }\n    hideDialog();\n  };\n"""
          todo, replaced = merge_re.subn(merge_new, todo, count=1)
          assert replaced == 1

          replace_re = re.compile(r"  const handleReplace = \(\) => \{.*?\n  \};\n", re.S)
          replace_new = """  const handleReplace = () => {\n    const newTodos = importedTodos.map((item, index) => createImportedTodo(item, index));\n    \n    closeAllInlineDatePickers();\n    if (!saveTodos(newTodos)) {\n      showTodoSaveError();\n      hideDialog();\n      return;\n    }\n\n    todos = newTodos;\n    applyFilters();\n    closeEditModal(false);\n    scheduleTodoReminderCheck();\n    showToast(window.i18n ? window.i18n.t('importSuccess', { count: newTodos.length }) : 'Imported ' + newTodos.length + ' todos successfully.', 'success');\n    hideDialog();\n  };\n"""
          todo, replaced = replace_re.subn(replace_new, todo, count=1)
          assert replaced == 1

          todo_path.write_text(todo)

          sw_path = Path('background/service-worker.js')
          sw = sw_path.read_text()
          sw_re = re.compile(r"async function evaluateDueReminders\(todos, notified, warnedInvalidDueDates, leadTime\) \{.*?\n\}\n\nasync function runReminderCheck", re.S)
          sw_new = """function getDueReminderCandidate(todo, notified, warnedInvalidDueDates, now, leadTime) {\n  if (todo.completed || todo.dueDate === null || todo.dueDate === undefined) {\n    return { skip: true, warnedUpdated: false };\n  }\n\n  const invalid = handleInvalidDueDate(todo, warnedInvalidDueDates);\n  if (invalid.skip) {\n    return { skip: true, warnedUpdated: invalid.warnedUpdated };\n  }\n\n  const due = parseDueDate(todo.dueDate, todo.dueTime);\n  const reminderTime = new Date(due.getTime() - Math.max(leadTime, CHECK_INTERVAL_MINUTES) * 60 * 1000);\n  if (now < reminderTime || now > due) {\n    return { skip: true, warnedUpdated: false };\n  }\n\n  const timePart = todo.dueTime && DUE_TIME_PATTERN.test(todo.dueTime) ? '_' + todo.dueTime : '';\n  const notifiedKey = todo.id + '_' + todo.dueDate + timePart;\n  if (notified[notifiedKey]) {\n    return { skip: true, warnedUpdated: false };\n  }\n\n  let dueDisplay = due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });\n  if (todo.dueTime && DUE_TIME_PATTERN.test(todo.dueTime)) {\n    dueDisplay += ' ' + due.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });\n  }\n  return { skip: false, warnedUpdated: false, notifiedKey, dueDisplay };\n}\n\nasync function evaluateDueReminders(todos, notified, warnedInvalidDueDates, leadTime) {\n  let updated = false;\n  let warnedUpdated = false;\n  const now = new Date();\n  for (const todo of todos) {\n    const candidate = getDueReminderCandidate(todo, notified, warnedInvalidDueDates, now, leadTime);\n    if (candidate.warnedUpdated) warnedUpdated = true;\n    if (candidate.skip) continue;\n    await showTodoNotification(todo, candidate.dueDisplay);\n    notified[candidate.notifiedKey] = Date.now();\n    updated = true;\n  }\n  return { updated, warnedUpdated };\n}\n\nasync function runReminderCheck"""
          sw, replaced = sw_re.subn(sw_new, sw, count=1)
          assert replaced == 1
          sw_path.write_text(sw)

          css_path = Path('css/app.css')
          css = css_path.read_text()
          css = css.replace('  color: #0d47a1;\n', '  color: #003b73;\n', 1)
          css = css.replace("body.light-theme .bulk-btn {\n  background: rgba(0, 0, 0, 0.05);\n  border-color: rgba(0, 0, 0, 0.1);\n  color: #1f2937;\n}", "body.light-theme .bulk-btn {\n  background: #f3f4f6;\n  border-color: rgba(0, 0, 0, 0.1);\n  color: #111827;\n}", 1)
          css = css.replace(".onboarding-close-btn:hover {\n  background: rgba(255, 255, 255, 0.1);\n  color: #ffffff;\n}", ".onboarding-close-btn:hover {\n  background: rgba(0, 0, 0, 0.55);\n  color: #ffffff;\n}", 1)
          css = css.replace(".onboarding-btn-secondary:hover {\n  background: rgba(255, 255, 255, 0.2);\n  color: #ffffff;\n}", ".onboarding-btn-secondary:hover {\n  background: rgba(0, 0, 0, 0.55);\n  color: #ffffff;\n}", 1)
          css = css.replace("body.light-theme .md-table-header {\n  background: rgba(0, 0, 0, 0.03);\n  border-bottom-color: rgba(0, 0, 0, 0.1);\n  color: #1f2937;\n}", "body.light-theme .md-table-header {\n  background: #f3f4f6;\n  border-bottom-color: rgba(0, 0, 0, 0.1);\n  color: #111827;\n}", 1)
          css_path.write_text(css)
          PY
      - name: Validate
        run: |
          node --check src/features/todo.js
          node --check background/service-worker.js
          git diff --check
          npm ci --ignore-scripts
          npm test -- --run
      - name: Remove temporary audit files and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f sonar-pr732-alerts.json .github/workflows/pr732-alert-audit.yml
          git add src/features/todo.js background/service-worker.js css/app.css sonar-pr732-alerts.json .github/workflows/pr732-alert-audit.yml
          git commit -m "fix: resolve PR #732 SonarCloud alerts"
          git push origin HEAD:claude/elastic-borg-609522
