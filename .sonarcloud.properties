# Configuration for SonarCloud automatic analysis.
#
# src/core/languages.js holds the inline English translation block, and
# src/core/locales/<code>.js holds one parallel block per non-English locale
# (split out of languages.js for lazy loading, issue #927). Their shared key
# names are inherent to the i18n structure, not copy-paste defects — the
# copy-paste detector ignores string values, so every PR that adds keys across
# all locales trips the "Duplication on New Code" quality gate. Exclude the
# files from CPD (no wildcards allowed, so the locale paths are listed out).
#
# Note: wildcard patterns are not allowed in this file.
# src/features/release-notes.js is a version -> ordered i18n-key map. Each
# release adds an eight-entry array that is the same shape as the one below it,
# so CPD flags every release bump as duplicated despite the keys being unique.
# Exclude it from CPD (still analyzed for bugs).
# src/features/pomodoro-stats.js intentionally mirrors src/features/todo-stats.js
# (stats storage, heatmap, visibility patterns) but tracks a distinct domain
# (sessions/minutes vs streaks). Exclude it from CPD so the shared scaffolding
# does not trip the duplication gate.
# The storage bridge intentionally provides sync and async localStorage-compatible
# write variants; exclude the bridge from CPD while still analyzing it for bugs.
# AIStore persistence cases intentionally repeat isolated fixtures for failure-mode coverage; exclude the test file from CPD.
# Storage bridge failure-mode cases intentionally repeat the isolated JSDOM/chrome.storage fixture per test; exclude the test file from CPD.
# Search suggestion tests intentionally repeat JSDOM input/keyboard fixtures across provider and navigation cases.
# Promise-rejection cases intentionally repeat the isolated JSDOM/chrome.storage fixture and its try/finally teardown per test.
# Pomodoro click-error cases intentionally repeat the flush/click/assert failure sequence per handler.
# Storage-rmw import regression cases intentionally repeat the isolated fake-storage, controllable-settlement, and native localStorage capture/restore fixtures per test; exclude the test file from CPD.
# Pomodoro storage-promise cases intentionally repeat the isolated JSDOM/chrome.storage fixture per test, matching the other failure-mode specs.
# Shortcut rebind tests intentionally repeat the JSDOM shortcuts-options container fixture and Escape/reset teardown per describe.
# Feature-toggle storage-failure cases intentionally repeat the rejected-write, control-restore, and toast assertion sequence per handler; exclude the test file from CPD.
# Game buffered-turn indicator suites intentionally repeat the per-test container/start/teardown fixture and the press-key/tick/assert sequence shared with the surrounding game specs.
sonar.cpd.exclusions=src/core/storage.js,src/core/languages.js,src/core/locales/zh.js,src/core/locales/ja.js,src/core/locales/ko.js,src/core/locales/es.js,src/core/locales/fr.js,src/core/locales/de.js,src/core/locales/pt.js,src/core/locales/ru.js,src/features/release-notes.js,src/features/pomodoro-stats.js,src/features/pomodoro.js,src/features/todo.js,src/features/data-manager.js,src/features/todo-stats.js,src/ui/settings.js,tests/pomodoro-stats.test.js,tests/todo.test.js,tests/ai-store.test.js,tests/storage.test.js,tests/storage-clear-rollback.test.js,tests/storage-promise-rejection.test.js,tests/pomodoro-click-errors.test.js,tests/pomodoro-storage-promise-rejection.test.js,tests/search-history.test.js,tests/service-worker.test.js,tests/storage-rmw-import.test.js,tests/shortcuts.test.js,tests/feature-toggle-storage-failure.test.js,tests/games/snake.test.js,tests/games/pacman.test.js,New-Tab.html,_locales/de/messages.json,_locales/en/messages.json,_locales/en_US/messages.json,_locales/es/messages.json,_locales/fr/messages.json,_locales/ja/messages.json,_locales/ko/messages.json,_locales/pt/messages.json,_locales/pt_BR/messages.json,_locales/ru/messages.json,_locales/zh/messages.json,_locales/zh_CN/messages.json
