# Configuration for SonarCloud automatic analysis.
#
# src/core/languages.js holds nine parallel translation blocks (one per
# supported locale). Their shared key names are inherent to the i18n
# structure, not copy-paste defects — the copy-paste detector ignores
# string values, so every PR that adds keys across all locales trips the
# "Duplication on New Code" quality gate. Exclude the file from CPD.
#
# Note: wildcard patterns are not allowed in this file.
# src/features/pomodoro-stats.js intentionally mirrors src/features/todo-stats.js
# (stats storage, heatmap, visibility patterns) but tracks a distinct domain
# (sessions/minutes vs streaks). Exclude it from CPD so the shared scaffolding
# does not trip the duplication gate.
sonar.cpd.exclusions=src/core/languages.js,src/features/pomodoro-stats.js,tests/pomodoro-stats.test.js
