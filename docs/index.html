<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <meta http-equiv="refresh" content="0; url=privacy-policy.html" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #5f6b7a;
      --accent: #2f6feb;
      --border: #d0d7de;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e6edf3;
        --muted: #9aa4b2;
        --accent: #79c0ff;
        --border: #30363d;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>New Tab</h1>
      <p>Redirecting to the <a href="privacy-policy.html">privacy policy</a>…</p>
    </div>
  </main>
</body>
</html>
